name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: forge test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install libraries (lib/ is not committed)
        run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
      - run: forge build --sizes
      - run: forge test -vv

  typescript:
    name: typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ops typecheck
        run: npm run typecheck --workspace ops
      - name: web typecheck
        run: npx tsc --noEmit
        working-directory: web
      - name: web lint
        run: npm run lint --workspace web
