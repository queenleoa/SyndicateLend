[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
hedera_testnet = "https://testnet.hashio.io/api"

# Hedera contract verification goes through Sourcify-compatible HashScan verifier:
#   forge verify-contract --verifier sourcify --verifier-url https://server-verify.hashscan.io --chain-id 296 <addr> <Contract>
